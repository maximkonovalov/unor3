name: compile

on:
  push:
    paths:
      - '**/*.ino'
      - '**/*.h'
      - '**/*.cpp'
      - '.github/workflows/compile.yml'
  pull_request:
    paths:
      - '**/*.ino'
      - '**/*.h'
      - '**/*.cpp'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

jobs:
  compile:
    name: ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: blink00
            fqbn: arduino:avr:uno
          - sketch: glow
            fqbn: arduino:avr:nano
            # NewPing's timer ISR clashes with tone(); see the patch step below.
            libraries: |
              - source-path: .ci-libs/libraries/NewPing
          - sketch: lcd00
            fqbn: arduino:avr:uno
            libraries: |
              - name: LiquidCrystal
                version: 1.0.7
          - sketch: oled00
            fqbn: arduino:avr:uno
            libraries: |
              - name: OLED Display 96x96
                version: 1.0.0
          - sketch: octopus
            fqbn: arduino:avr:uno
            # The sketch uses the pre-3.0 IRremote interface (decode_results).
            libraries: |
              - name: IRremote
                version: 2.6.0
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        if: matrix.sketch == 'glow'

      # glow needs NewPing with TIMER_ENABLED false (it uses tone(), which
      # shares Timer2).  Stock NewPing hardcodes it to true, so patch a copy.
      - name: Patch NewPing
        if: matrix.sketch == 'glow'
        env:
          ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}/.ci-libs
        run: |
          arduino-cli lib install NewPing@1.9.7
          sed -i 's/#define TIMER_ENABLED true/#define TIMER_ENABLED false/' \
            "$ARDUINO_DIRECTORIES_USER/libraries/NewPing/src/NewPing.h"
          if grep -q 'TIMER_ENABLED true' "$ARDUINO_DIRECTORIES_USER/libraries/NewPing/src/NewPing.h"; then
            echo "NewPing patch did not apply" >&2
            exit 1
          fi

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: |
            - ${{ matrix.sketch }}
          libraries: ${{ matrix.libraries }}
